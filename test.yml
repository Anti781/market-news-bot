name: Free Market News Bot

on:
  schedule:
    - cron: '0 6 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '15 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install feedparser requests yfinance matplotlib google-genai

      - name: Run bot and publish to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Save seen news history
        run: |
          if [ -f seen_news.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_news.json
            git diff --staged --quiet || git commit -m "Update seen news history"
            git push
          fi
